#:schema ../__pyronaut__/schemas/micronaut-application.schema.json
# Generated by pyronaut-install for Pyronaut TOML schema support.

[micronaut.application]
name = "calendar"

[micronaut.server]
port = 8123

[micronaut.router.static-resources.default]
enabled = true
mapping = "/**"
paths = ["classpath:public"]

[micronaut.router.static-resources.swagger]
paths = "classpath:META-INF/swagger"
mapping = "/swagger/**"

[micronaut.router.static-resources.swagger-ui]
paths = "classpath:META-INF/swagger/views/swagger-ui"
mapping = "/swagger-ui/**"

[micronaut.caches.categories]
maximum-size = 100
expire-after-write = "10m"

[datasources.default]
url = "jdbc:h2:file:./data/calendar;AUTO_SERVER=TRUE"
driver-class-name = "org.h2.Driver"
username = "sa"
password = ""
dialect = "H2"

[flyway.datasources.default]
enabled = true

[endpoints.all]
sensitive = false

[endpoints.health]
details-visible = "ANONYMOUS"

# ---- application settings (@ConfigurationProperties("calendar")) ----
[calendar]
name = "Pyronaut Calendar"
default-duration-minutes = 60
default-reminder-minutes = 15
reminder-check-interval = "30s"
default-categories = ["Work", "Personal", "Family", "Health"]

# Development helpers: /api/testing/* and the UI's "Testing" menu. Turn off in production.
[calendar.testing]
enabled = true

# Jakarta EL templates, parsed at runtime - edit and restart, no rebuild needed.
# They use the deferred #{...} syntax because Micronaut resolves ${...} in config values as property placeholders.
[calendar.templates]
agenda-header = "#{calendar} · #{day} · #{count == 0 ? 'nothing planned' : count += (count == 1 ? ' event' : ' events')}"
agenda-line = "#{event.multiDay ? '(multi-day)  ' : event.start += '–' += event.end += '  '}#{event.title}#{empty event.location ? '' : ' @ ' += event.location}#{empty event.category ? '' : ' [' += event.category += ']'}"
ical-description = "#{event.description}#{empty event.description or empty event.category ? '' : '\n\n'}#{empty event.category ? '' : 'Category: ' += event.category}"
