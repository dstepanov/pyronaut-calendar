#:schema ./__pyronaut__/schemas/pyronaut-pyproject.schema.json
# Generated by pyronaut-install for Pyronaut TOML schema support.

[project]
name = "calendar"
version = "0.1.0"

[build-system]
requires = ["setuptools", "wheel", "tomli"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir."" = "src"
packages.find.where = ["src"]

[tool.pyronaut]
repositories = ["mavenCentral"]
core.version = "5.2.0"
platform.version = "5.1.0"

[tool.pyronaut.toolchain]
type = "jvm"

[tool.pyronaut.sources]
python = "src"
python-test = "tests"
java = "src-java"
resources = "config"
test-resources = "tests-config"

[tool.pyronaut.dependencies]
runtime = [
  "io.micronaut:micronaut-http-server-netty",
  "io.micronaut.serde:micronaut-serde-jackson",
  "io.micronaut.validation:micronaut-validation",
  "io.micronaut.data:micronaut-data-jdbc",
  "io.micronaut.sql:micronaut-jdbc-hikari",
  "io.micronaut.flyway:micronaut-flyway",
  "com.h2database:h2",
  "io.micronaut.cache:micronaut-cache-caffeine",
  "io.micronaut:micronaut-management",
  "io.micronaut:micronaut-websocket",
  "io.swagger.core.v3:swagger-annotations",
  "io.micronaut.el:micronaut-jakarta-el:1.1.0",
  "io.micronaut.el:micronaut-jakarta-el-interpreter:1.1.0",
  "io.micronaut.pyronaut:micronaut-pyronaut-logback"
]
build = [
  "io.micronaut.serde:micronaut-serde-processor",
  "io.micronaut.validation:micronaut-validation-processor",
  "io.micronaut.data:micronaut-data-processor",
  "io.micronaut.openapi:micronaut-openapi"
]
test = [
  "io.micronaut.pyronaut:micronaut-pyronaut-pytest",
  "io.micronaut.pyronaut:micronaut-pyronaut-requests",
  "io.micronaut.test:micronaut-test-junit5"
]

[tool.pyronaut.ide-stubs]
enabled = true
ide = "pycharm"
packages = ["io.micronaut", "jakarta"]
exclude-patterns = ["*ModuleInfo"]
destination-dir = "__pyronaut__/ide-stubs"

[tool.pyronaut.validation]
# MICRONAUT_ENVIRONMENTS (used by the e2e tests) is not in the generated configuration schema
suppressions = ["micronaut.environments"]
